name: Knowledge Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-from-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -r requirements-import.txt
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_BASE: /AMC.github.io/
          VITE_API_URL: ${{ vars.API_URL || (github.repository == 'Narutomaki-0721/AMC.github.io' && 'https://mcm-team-api.mcm-hub.workers.dev') || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v4
